    <!-- 資料庫載入：本地檔案優先，若無則由 jsDelivr CDN 動態載入 -->
    <script src="master_lookup_db.js"></script>
    <script src="core_guides_data.js"></script>
    <!-- jsDelivr 直接從 GitHub repo 提供 CDN，不需要額外設定 -->
    <script>
        // 嘗試順序：1) window.MASTER_DB_DATA (本地 file:// 模式) → 2) jsDelivr CDN
        window._DB_LOADED = false;
        // 指向 master_lookup_db.js 所在的具體 commit SHA（3c8f38fa），確保長期穩定
        const DB_CDN_URL = 'https://cdn.jsdelivr.net/gh/Kevinte67228/keiba-daijin-2026@895b0738511f376f7d55f62157dc761fb7b2627c/master_lookup_db.js';

        function showLoading(msg) {
            const el = document.getElementById('loadingMsg');
            if (el) {
                if (msg) {
                    el.style.display = 'block';
                    el.innerHTML = msg;
                } else {
                    el.style.display = 'none';
                }
            }
        }

        async function loadDatabase() {
            if (window.MASTER_DB_DATA) {
                window._DB_LOADED = true;
                if (typeof dbData !== 'undefined') dbData = window.MASTER_DB_DATA;
                if (typeof init === 'function') init();
                return;
            }
            showLoading('⏳ 正在從 CDN 載入資料庫（首次約需 5~15 秒）...');
            try {
                const resp = await fetch(DB_CDN_URL);
                const text = await resp.text();
                // Execute the JS which sets window.MASTER_DB_DATA
                const script = document.createElement('script');
                script.textContent = text;
                document.head.appendChild(script);
                window._DB_LOADED = true;
                if (window.MASTER_DB_DATA && typeof dbData !== 'undefined') {
                    dbData = window.MASTER_DB_DATA;
                }
                showLoading('');
                if (typeof init === 'function') init();
            } catch (e) {
                showLoading('❌ 資料庫載入失敗，請確認網路連線後重新整理。Error: ' + e.message);
            }
        }

        async function clearPwaCache() {
            if (!confirm("確定要清除手機/瀏覽器本機暫存並重新載入最新版本嗎？")) return;
            showLoading("🧹 正在清除快取並重新載入最新版本...");
            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(r => r.unregister()));
                }
                localStorage.clear();
                sessionStorage.clear();
                window.location.reload(true);
            } catch (err) {
                alert("清除快取時發生錯誤: " + err.message);
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', loadDatabase);
    </script>

                <!-- Dynamic Stats -->
            </div>
        </div>
    </div>
    <script>
        let dbData = { all_horses: [], recommendations: [] };
        let currentTab = "all_horses";
        let sortField = "sp";
        let sortAsc = false;
        let currentAppMode = 'horses';
        let cropperInstance = null;

        const ticketWeights = {
            "🌈 虹札": 6, "虹": 6,
            "🥇 金札": 5, "金": 5,
            "🥈 銀札": 4, "銀": 4,
            "🥉 銅札": 3, "銅": 3,
            "🟢 綠札": 2, "綠": 2, "緑": 2,
            "⚪ 無札": 1, "無": 1, "": 0
        };

        const rankWeights = {
            "S+": 16, "S": 15,
            "A+": 14, "A": 13,
            "B+": 12, "B": 11,
            "C+": 10, "C": 9,
            "D+": 8, "D": 7,
            "E+": 6, "E": 5,
            "F+": 4, "F": 3,
            "G+": 2, "G": 1,
            "-": 0, "": 0
        };

        const trackWeights = {
            "◎": 4, "○": 3, "△": 2, "×": 1, "-": 0, "": 0
        };

        function formatRegion(r) {
            if (!r || r === "-") return "-";
            if (r === "欧" || r.includes("欧") || r.includes("歐") || r.includes("EU") || r.includes("Europe")) return "🇪🇺 歐洲 (EU)";
            if (r.includes("米") || r.includes("美") || r.includes("US")) return "🇺🇸 米國 (US)";
            if (r.includes("日") || r.includes("JP")) return "🇯🇵 日本";
            return r;
        }

        function parseTrack(trackStr) {
            if (!trackStr || trackStr === "-") return { grass: "-", dirt: "-" };
            let grass = "-", dirt = "-";
            if (trackStr.includes("芝") || trackStr.includes("ダ")) {
                let mGrass = trackStr.match(/芝([◎○△×])/);
                let mDirt = trackStr.match(/ダ([◎○△×])/);
                if (mGrass) grass = mGrass[1];
                if (mDirt) dirt = mDirt[1];
            } else {
                let symbols = trackStr.match(/([◎○△×])/g);
                if (symbols && symbols.length >= 2) {
                    grass = symbols[0];
                    dirt = symbols[1];
                } else if (symbols && symbols.length === 1) {
                    grass = symbols[0];
                }
            }
            return { grass, dirt };
        }

        function renderRankBadge(rank) {
            if (!rank || rank === "-") return "-";
            let color = "var(--text-muted)";
            if (rank.startsWith("S")) color = "#f59e0b; font-weight:bold;";
            else if (rank.startsWith("A")) color = "#a855f7; font-weight:bold;";
            else if (rank.startsWith("B")) color = "#38bdf8; font-weight:600;";
            else if (rank.startsWith("C")) color = "#22c55e;";
            else if (rank.startsWith("D")) color = "#cbd5e1;";
            return `<span style="color:${color}">${rank}</span>`;
        }

        function renderTrackBadge(sym) {
            if (!sym || sym === "-") return "-";
            if (sym === "◎") return `<span style="color:#f59e0b; font-weight:bold; font-size:1.05rem;">◎</span>`;
            if (sym === "○") return `<span style="color:#22c55e; font-weight:bold; font-size:1.05rem;">○</span>`;
            if (sym === "△") return `<span style="color:#38bdf8; font-size:1rem;">△</span>`;
            if (sym === "×") return `<span style="color:#ef4444; font-size:1rem;">×</span>`;
            return sym;
        }

        function renderStarsBadge(stars) {
            if (!stars || stars === "-") return "-";
            if (stars.includes("★★★") || stars === "3") {
                return `<span style="color:#f59e0b; font-weight:bold; text-shadow:0 0 6px rgba(245,158,11,0.4);">★★★</span>`;
            }
            if (stars.includes("★★") || stars === "2") {
                return `<span style="color:#fbbf24; font-weight:bold;">★★</span>`;
            }
            if (stars.includes("★") || stars === "1") {
                return `<span style="color:#38bdf8; font-weight:600;">★</span>`;
            }
            return `<span style="color:var(--text-muted);">${stars}</span>`;
        }

        function renderTicketBadge(ticket) {
            if (!ticket) return "-";
            if (ticket.includes("虹")) return `<span class="badge badge-rainbow">🌈 虹札</span>`;
            if (ticket.includes("金")) return `<span class="badge badge-gold">🥇 金札</span>`;
            if (ticket.includes("銀")) return `<span class="badge badge-silver">🥈 銀札</span>`;
            if (ticket.includes("銅")) return `<span class="badge badge-bronze">🥉 銅札</span>`;
            if (ticket.includes("綠") || ticket.includes("緑")) return `<span class="badge badge-green">🟢 綠札</span>`;
            return ticket;
        }

        function escapeQuote(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, "&quot;") : "";
        }

        function generateAIComment(h) {
            if (!h) return "尚無評語";
            const parts = [];
            const sp = parseInt(h.sp || h.matched_sp) || 0;
            const sub = parseInt(h.subpara_total) || 0;
            if (sp >= 75) parts.push(`⚡ 擁有極高之 SP 速度能力 (${sp})，具備奪取頂級 G1 之強大即戰力。`);
            else if (sp >= 70) parts.push(`🐎 速度屬性優良 (${sp})，於重賞賽事具備高度競爭力。`);
            if (sub >= 75) parts.push(`💎 次能力極其全面均衡 (次能力合計 ${sub})，無明顯弱點。`);
            if (h.track && h.track.includes("◎")) parts.push(`🎯 賽道適性出色 (${h.track})，發揮極其穩定。`);
            if (h.traits && h.traits !== "無特殊特性" && h.traits !== "-") parts.push(`✨ 具備關鍵特性「${h.traits}」，關鍵戰局往往能發揮奇效。`);
            if (h.umarsonality && h.umarsonality !== "-") parts.push(`🐴 馬匹個性為「${h.umarsonality}」。`);
            if (h.foal_quality && parseInt(h.foal_quality) >= 6) parts.push(`🧬 具備高繁殖潛力 (仔出評級 ${h.foal_quality})，退役後極具配種價值。`);
            return parts.length > 0 ? parts.join(" ") : "基礎素質健全，適合依適性距離與賽道穩健安排賽程。";
        }

        function syncHorseData() {
            if (!dbData || !dbData.all_horses || !dbData.recommendations) return;
            const horseMap = new Map();
            dbData.all_horses.forEach(h => {
                if (h.name) horseMap.set(h.name, h);
            });
            dbData.recommendations.forEach(r => {
                const match = horseMap.get(r.name);
                if (match) {
                    if (!r.matched_sp || r.matched_sp === "-") r.matched_sp = match.sp;
                    if (!r.sp || r.sp === "-") r.sp = match.sp;
                    if (!r.shunhatsu || r.shunhatsu === "-") r.shunhatsu = match.shunhatsu;
                    if (!r.konjo || r.konjo === "-") r.konjo = match.konjo;
                    if (!r.power || r.power === "-") r.power = match.power;
                    if (!r.seishin || r.seishin === "-") r.seishin = match.seishin;
                    if (!r.keshikosa || r.keshikosa === "-") r.keshikosa = match.keshikosa;
                    if (!r.junan || r.junan === "-") r.junan = match.junan;
                    if (!r.kenko || r.kenko === "-") r.kenko = match.kenko;
                    if (!r.distance || r.distance === "-") r.distance = match.distance;
                    if (!r.grass || r.grass === "-") r.grass = match.grass;
                    if (!r.dirt || r.dirt === "-") r.dirt = match.dirt;
                    if (!r.sex || r.sex === "-") r.sex = match.sex;
                    if (!r.sire || r.sire === "-") r.sire = match.sire;
                    if (!r.dam || r.dam === "-") r.dam = match.dam;
                    if (!r.ticket || r.ticket === "-") r.ticket = match.ticket;
                    if (!r.growth || r.growth === "-") r.growth = match.growth;
                }
            });
        }

        function unpackDatabase(data) {
            if (!data) return { all_horses: [], recommendations: [] };
            if (data.schema === "columnar_v1") {
                const cols = data.columns || [];
                const horses = [];
                (data.all_horses || []).forEach(row => {
                    const obj = {};
                    cols.forEach((col, i) => { obj[col] = row[i]; });
                    const tr = parseTrack(obj.track);
                    obj.grass = tr.grass;
                    obj.dirt = tr.dirt;
                    horses.push(obj);
                });
                const recCols = data.rec_columns || [];
                const recs = [];
                (data.recommendations || []).forEach(row => {
                    const obj = {};
                    recCols.forEach((col, i) => { obj[col] = row[i]; });
                    const tr = parseTrack(obj.track);
                    obj.grass = tr.grass;
                    obj.dirt = tr.dirt;
                    recs.push(obj);
                });
                return { all_horses: horses, recommendations: recs };
            }
            return data;
        }

        function getSortValue(item, field) {
            if (!item) return 0;
            if (field === "ticket") return ticketWeights[item.ticket] || 0;
            if (field === "year") return parseInt(item.year) || 0;
            if (field === "sp" || field === "matched_sp" || field === "sp_max" || field === "price" || field === "reputation") {
                let val = item[field] !== undefined ? item[field] : item.matched_sp;
                return parseInt(val) || 0;
            }
            if (field === "foal_count") {
                let m = (item.foal_count || "").match(/\d+/);
                return m ? parseInt(m[0]) : 0;
            }
            if (field === "stars") {
                let s = item.stars || "";
                return (s.match(/★/g) || []).length;
            }
            if (field === "distance") {
                let m = (item.distance || "").match(/\d+/);
                return m ? parseInt(m[0]) : 0;
            }
            if (['shunhatsu', 'konjo', 'power', 'seishin', 'keshikosa', 'junan', 'kenko'].includes(field)) {
                return rankWeights[item[field]] || 0;
            }
            if (field === "grass" || field === "dirt") {
                return trackWeights[item[field]] || 0;
            }
            return (item[field] || item.details || "").toString().toLowerCase();
        }

        function renderTable() {
            if (window.MASTER_DB_DATA && (!dbData || !dbData.all_horses || dbData.all_horses.length === 0)) {
                dbData = unpackDatabase(window.MASTER_DB_DATA);
                syncHorseData();
            }

            const yearVal = document.getElementById("filterYear") ? document.getElementById("filterYear").value : "ALL";
            const ticketVal = document.getElementById("filterTicket") ? document.getElementById("filterTicket").value : "ALL";
            const sexVal = document.getElementById("filterSex") ? document.getElementById("filterSex").value : "ALL";
            const spVal = document.getElementById("filterSp") ? (parseInt(document.getElementById("filterSp").value) || 0) : 0;
            const distVal = document.getElementById("filterDistance") ? document.getElementById("filterDistance").value : "ALL";
            const regionVal = document.getElementById("filterRegion") ? document.getElementById("filterRegion").value : "ALL";
            const searchVal = document.getElementById("filterSearch") ? document.getElementById("filterSearch").value.trim().toLowerCase() : "";

            let dataset = [];
            if (dbData) {
                if (currentTab === "all_horses") {
                    dataset = dbData.all_horses || [];
                } else if (dbData.recommendations) {
                    dataset = dbData.recommendations.filter(r => r.category === currentTab);
                }
            }

            let filtered = dataset.filter(item => {
                if (!item) return false;
                if (yearVal !== "ALL" && item.year != yearVal) return false;
                if (ticketVal !== "ALL") {
                    const t = item.ticket || "";
                    if (!t.includes(ticketVal)) return false;
                }
                if (sexVal !== "ALL") {
                    const s = item.sex || "";
                    if (!s.includes(sexVal)) return false;
                }
                
                const sp = parseInt(item.sp || item.matched_sp) || 0;
                if (spVal > 0 && sp < spVal) return false;

                if (distVal !== "ALL") {
                    const targetDist = parseInt(distVal);
                    const m = (item.distance || "").match(/(\d+)/);
                    const itemMinDist = m ? parseInt(m[1]) : 0;
                    if (distVal === "2500") {
                        if (itemMinDist < 2500) return false;
                    } else {
                        if (itemMinDist !== targetDist) return false;
                    }
                }

                if (regionVal !== "ALL") {
                    const r = item.region || "";
                    if (regionVal === "日本") {
                        if (!r.includes("日")) return false;
                    } else if (regionVal === "米") {
                        if (!r.includes("米") && !r.includes("美") && !r.includes("US")) return false;
                    } else if (regionVal === "欧") {
                        if (!r.includes("欧") && !r.includes("歐") && !r.includes("EU") && !r.includes("Europe")) return false;
                    }
                }

                if (searchVal) {
                    const name = (item.name || "").toLowerCase();
                    const sire = (item.sire || "").toLowerCase();
                    const dam = (item.dam || "").toLowerCase();
                    const details = (item.details || item.comment || "").toLowerCase();
                    if (!name.includes(searchVal) && !sire.includes(searchVal) && !dam.includes(searchVal) && !details.includes(searchVal)) return false;
                }
                return true;
            });

            filtered.sort((a, b) => {
                let valA = getSortValue(a, sortField);
                let valB = getSortValue(b, sortField);
                if (typeof valA === "number" && typeof valB === "number") {
                    return sortAsc ? valA - valB : valB - valA;
                }
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            const matchCountEl = document.getElementById("matchCount");
            if (matchCountEl) matchCountEl.textContent = filtered.length.toLocaleString();

            renderHeader();
            renderBody(filtered);
        }

            }

            cols.forEach(c => {

                th.innerHTML = `${c.title} <span class="sort-icon">${sortField === c.key ? (sortAsc ? "▲" : "▼") : ""}</span>`;
                if (c.key !== "action") {
                    th.addEventListener("click", () => {
                        if (sortField === c.key) {
                            sortAsc = !sortAsc;
                        } else {
                            sortField = c.key;
                            sortAsc = false;
                        }
                        renderTable();
                    });
                }
                tr.appendChild(th);
            });
        }

        function openModalByName(horseName) {
            let h = dbData.all_horses ? dbData.all_horses.find(x => x.name === horseName) : null;

                <div class="stat-item"><div class="stat-label">母馬 (所屬牝系)</div><div class="stat-value" style="color:#f472b6; font-weight:600;">${h.dam || (r ? r.dam : "-")} <span style="font-size:0.8rem; color:var(--text-muted);">(${h.dam_line || "-"})</span></div></div>

                <!-- 2. 競爭能力 & 個性 -->
                <div class="modal-section-title">⚡ 競爭能力 & 特性個性</div>
                <div class="stat-item"><div class="stat-label">基本 SP (成長上限)</div><div class="stat-value" style="color:var(--gold-color);">${h.sp || "-"} <span style="font-size:0.85rem; color:#94a3b8;">(${h.sp_max || "-"})</span></div></div>
                <div class="stat-item"><div class="stat-label">耐力 (スタミナ) / 次能力合計</div><div class="stat-value" style="color:#38bdf8;">${h.stamina || "-"} / ${h.subpara_total || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">瞬發力 / 勝負根性</div><div class="stat-value">${renderRankBadge(h.shunhatsu)} / ${renderRankBadge(h.konjo)}</div></div>
                <div class="stat-item"><div class="stat-label">力量 / 精神力</div><div class="stat-value">${renderRankBadge(h.power)} / ${renderRankBadge(h.seishin)}</div></div>
                <div class="stat-item"><div class="stat-label">智商 / 柔軟性 / 健康</div><div class="stat-value">${renderRankBadge(h.keshikosa)} / ${renderRankBadge(h.junan)} / ${renderRankBadge(h.kenko)}</div></div>
                <div class="stat-item"><div class="stat-label">腳質 / 氣性 / 性格</div><div class="stat-value">${h.running_style || "-"} / ${h.temperament || "-"} / ${h.personality || "-"}</div></div>
                <div class="stat-item full-width"><div class="stat-label">戰術特性</div><div class="stat-value" style="color:#fbbf24; font-weight:600;">${h.traits || "無特殊特性"}</div></div>
                <div class="stat-item full-width"><div class="stat-label">🐴 馬匹個性 (ウマーソナリティ)</div><div class="stat-value" style="color:#a78bfa; font-weight:600;">${h.umarsonality || "無特殊個性"}</div></div>

                <!-- 3. 適性與迴轉 -->
                <div class="modal-section-title">🎯 賽道、距離與迴轉適性</div>
                <div class="stat-item"><div class="stat-label">距離適性</div><div class="stat-value">${h.distance || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">馬場適性 (芝 / ダ)</div><div class="stat-value">${renderTrackBadge(h.grass || "-")} / ${renderTrackBadge(h.dirt || "-")} (${h.track || "-"})</div></div>
                <div class="stat-item"><div class="stat-label">瞬發 / 持續 / 消耗 適性上限</div><div class="stat-value" style="font-size:0.85rem;">${h.shunhatsu_apt || "-"} / ${h.jizoku_apt || "-"} / ${h.shoumo_apt || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">迴轉適性 (小 / 左 / 右)</div><div class="stat-value">${h.komawari || "〇"} / ${h.hidarimawari || "〇"} / ${h.migimawari || "〇"}</div></div>
                <div class="stat-item full-width"><div class="stat-label">體質健康風險 (喉鳴 / 腳部不安 / 腰甘)</div><div class="stat-value">${h.nodonari || "〇"} / ${h.kyakubu_fuan || "〇"} / ${h.koshi_no_amasa || "〇"}</div></div>

                <!-- 4. 成長模式 & 繁殖遺傳 -->
                <div class="modal-section-title">🌱 成長力 & 繁殖遺傳能力</div>
                <div class="stat-item"><div class="stat-label">成長型 / 成長力</div><div class="stat-value">${h.growth || "-"} (${h.growth_cap || "-"})</div></div>
                <div class="stat-item"><div class="stat-label">壽命 / 毛色</div><div class="stat-value">${h.life || "100"} / ${h.coat_color || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">繼承特性</div><div class="stat-value" style="font-size:0.85rem; color:#f43f5e; font-weight:600;">${h.inheritance || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">仔出評級 (繁殖潛力)</div><div class="stat-value" style="color:var(--gold-color); font-weight:bold; font-size:1.1rem;">${h.foal_quality || "-"}</div></div>
                <div class="stat-item full-width"><div class="stat-label">詳細攻略建議與評語</div><div class="stat-value" style="font-size:0.85rem; font-weight:normal; line-height:1.4;">${h.comment || (r ? (r.details || r.comment) : "") || generateAIComment(h)}</div></div>
            `;

            document.getElementById("modalBackdrop").style.display = "flex";
        }

        function closeModal() {
            const el = document.getElementById("modalBackdrop");
            if (el) el.style.display = "none";
        }

        function toggleFilterPanel() {
            const panel = document.getElementById("filterPanel");
            const text = document.getElementById("filterToggleText");
            const icon = document.getElementById("filterToggleIcon");
            if (!panel) return;
            const isCollapsed = panel.classList.toggle("collapsed");
            if (text) text.textContent = isCollapsed ? "展開" : "收折";
            if (icon) icon.textContent = isCollapsed ? "▼" : "▲";
        }

        // ===== 雙模式切換邏輯 (馬匹速查 / 16大核心攻略) =====
        function switchMainMode(mode) {
            currentAppMode = mode;
            const btnH = document.getElementById('btnModeHorses');
            const btnG = document.getElementById('btnModeGuides');
            const viewH = document.getElementById('horsesView');
            const viewG = document.getElementById('guidesView');

            if (!btnH || !btnG || !viewH || !viewG) return;

            if (mode === 'horses') {
                btnH.classList.add('active');
                btnG.classList.remove('active');
                viewH.style.display = 'block';
                viewG.style.display = 'none';
            } else {
                btnH.classList.remove('active');
                btnG.classList.add('active');
                viewH.style.display = 'none';
                viewG.style.display = 'block';
                renderGuidesGrid();
            }
        }

        function renderGuidesGrid() {
            const container = document.getElementById('guidesGridContainer');
            if (!container) return;
            const list = window.CORE_GUIDES_DATA || [];
            if (list.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); padding:20px;">攻略資料載入中...</div>';
                return;
            }

            container.innerHTML = list.map(g => `
                <div class="guide-card" onclick="openGuideModal('${g.id}')">
                    <div class="guide-card-tag" style="color: ${g.tag_color || '#38bdf8'};">
                        <span>${g.icon || '🚀'}</span> ${g.category}
                    </div>
                    <div class="guide-card-title">${g.title}</div>
                </div>
            `).join('');
        }

        function openGuideModal(guideId) {
            const list = window.CORE_GUIDES_DATA || [];
            const g = list.find(x => x.id === guideId);
            if (!g) return;

            const tagEl = document.getElementById('guideModalTag');
            if (tagEl) {
                tagEl.textContent = g.category;
                tagEl.style.backgroundColor = (g.tag_color || '#38bdf8') + '22';
                tagEl.style.color = g.tag_color || '#38bdf8';
                tagEl.style.border = `1px solid ${g.tag_color || '#38bdf8'}`;
            }

            const titleEl = document.getElementById('guideModalTitle');
            if (titleEl) titleEl.textContent = `${g.icon || ''} ${g.title}`;

            const sumEl = document.getElementById('guideModalSummary');
            if (sumEl) sumEl.textContent = g.summary || '';

            const contentEl = document.getElementById('guideModalContent');
            if (contentEl) {
                contentEl.innerHTML = (g.sections || []).map(sec => `
                    <div class="guide-modal-section">
                        <h3>${sec.title}</h3>
                        ${sec.html}
                    </div>
                `).join('');
            }

            const backdrop = document.getElementById('guideModalBackdrop');
            if (backdrop) backdrop.style.display = 'flex';
        }

        function closeGuideModal() {
            const el = document.getElementById('guideModalBackdrop');
            if (el) el.style.display = 'none';
        }

        // ===== 📷 OCR 圖片裁切與文字辨識流程 (Cropper.js + Tesseract.js) =====
        function triggerCameraOcr() {
            document.getElementById('ocrCameraInput').click();
        }

        function triggerGalleryOcr() {
            document.getElementById('ocrGalleryInput').click();
        }

        function handleOcrImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('cropperTargetImg');
                img.src = e.target.result;
                document.getElementById('cropperModalBackdrop').style.display = 'flex';

                if (cropperInstance) {
                    cropperInstance.destroy();
                    cropperInstance = null;
                }

                setTimeout(() => {
                    cropperInstance = new Cropper(img, {
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.7,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: true,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                }, 150);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function rotateCropper() {
            if (cropperInstance) {
                cropperInstance.rotate(90);
            }
        }

        function closeCropperModal() {
            const el = document.getElementById('cropperModalBackdrop');
            if (el) el.style.display = 'none';
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
        }

        async function executeCroppedOcr() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                maxWidth: 1000,
                maxHeight: 1000,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            closeCropperModal();

            if (!canvas) {
                alert("無法獲取裁切區域圖片，請重試");
                return;
            }

            canvas.toBlob(async (blob) => {
                await runOcrOnBlob(blob);
            }, 'image/png');
        }

        async function runOcrOnBlob(blob) {
            const statusEl = document.getElementById('ocrStatus');
            const btnCam = document.getElementById('btnOcrCam');
            const btnGal = document.getElementById('btnOcrGal');
            if (statusEl) {
                statusEl.style.display = 'block';
                statusEl.textContent = '⏳ 正在啟動 OCR 辨識引擎...';
            }
            if (btnCam) btnCam.disabled = true;
            if (btnGal) btnGal.disabled = true;

            try {
                if (!window.Tesseract) {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                }

                if (statusEl) statusEl.textContent = '🔍 正在分析裁切文字...';
                
                const worker = await Tesseract.createWorker('jpn+eng', 1, {
                    logger: m => {
                        if (m.status === 'recognizing text' && statusEl) {
                            statusEl.textContent = `🔍 正在辨識文字: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });

                const ret = await worker.recognize(blob);
                await worker.terminate();

                let rawText = ret.data.text || "";
                let lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                let recognizedWord = "";
                
                for (let line of lines) {
                    let cleaned = line.replace(/[|!@#$%^&*()_+={}\[\]:;"'<>?,.\/~`0-9a-zA-Z]/g, '').trim();
                    if (cleaned.length >= 2) {
                        recognizedWord = cleaned.split(' ')[0];
                        break;
                    }
                }
                
                if (!recognizedWord && lines.length > 0) {
                    recognizedWord = lines[0].replace(/[\r\n\t]/g, '').trim();
                }

                if (recognizedWord) {
                    const searchInput = document.getElementById('filterSearch');
                    if (searchInput) searchInput.value = recognizedWord;
                    if (statusEl) statusEl.innerHTML = `✅ 辨識完成！關鍵字：「<b style="color:#fbbf24;">${recognizedWord}</b>」已自動搜尋`;
                    renderTable();
                } else {
                    if (statusEl) statusEl.textContent = '⚠️ 未能辨識出有效馬名，請裁切更特寫的馬名區域';
                }
            } catch (err) {
                console.error("OCR Error:", err);
                if (statusEl) statusEl.textContent = '❌ OCR 辨識發生錯誤，請檢查網路連線或直接手動輸入';
            } finally {
                if (btnCam) btnCam.disabled = false;
                if (btnGal) btnGal.disabled = false;
            }
        }

        // ===== 核心初始化流程 (初始化所有分類頁籤、篩選事件、年份下拉選單) =====
                function clearSearchInput() {
            const input = document.getElementById('filterSearch');
            const clearBtn = document.getElementById('searchClearBtn');
            if (input) {
                input.value = '';
                if (clearBtn) clearBtn.style.display = 'none';
                renderTable();
                input.focus();
            }
        }

        function init() {
            console.log('Initializing PWA Application...');
            if (window.MASTER_DB_DATA) {
                dbData = unpackDatabase(window.MASTER_DB_DATA);
                syncHorseData();
            }

            // 1. 綁定 8 大類別切換頁籤事件
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTab = btn.getAttribute('data-cat') || "all_horses";
                    renderTable();
                });
            });

            // 2. 動態生成登場年度下拉選單 (1968 ~ 2023 降序)
            const yearSelect = document.getElementById('filterYear');
            if (yearSelect) {
                yearSelect.innerHTML = '<option value="ALL">全部年份</option>';
                const years = new Set();
                if (dbData.all_horses) {
                    dbData.all_horses.forEach(h => { if (h.year) years.add(parseInt(h.year)); });
                }
                const sortedYears = Array.from(years).sort((a, b) => a - b);
                sortedYears.forEach(y => {
                    if (!isNaN(y)) {
                        const opt = document.createElement('option');
                        opt.value = y;
                        opt.textContent = `${y} 年`;
                        yearSelect.appendChild(opt);
                    }
                });
            }

            // 3. 綁定所有篩選控制項事件
            ['filterYear', 'filterTicket', 'filterSex', 'filterDistance', 'filterRegion'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('change', renderTable);
            });

            const spEl = document.getElementById('filterSp');
            if (spEl) spEl.addEventListener('input', renderTable);

            const searchEl = document.getElementById('filterSearch');
            const searchClear = document.getElementById('searchClearBtn');
            if (searchEl) {
                searchEl.addEventListener('input', () => {
                    if (searchClear) searchClear.style.display = searchEl.value ? 'block' : 'none';
                    renderTable();
                });
            }

            // 4. 首次渲染表格與攻略網格
            renderTable();
            renderGuidesGrid();

            const loadingEl = document.getElementById('loadingMsg');
            if (loadingEl) loadingEl.style.display = 'none';
        }

        // 點擊背景關閉 Modal
        window.addEventListener('click', (e) => {
            const hModal = document.getElementById('modalBackdrop');
            if (e.target === hModal) closeModal();
            const gModal = document.getElementById('guideModalBackdrop');
            if (e.target === gModal) closeGuideModal();
            const cModal = document.getElementById('cropperModalBackdrop');
            if (e.target === cModal) closeCropperModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window._DB_LOADED) {
                init();
            }
        });
    </script>
