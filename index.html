    <!-- 資料庫載入：從 jsDelivr CDN 動態載入（PWA 線上模式）-->
    <!-- jsDelivr 直接從 GitHub repo 提供 CDN，不需要額外設定 -->
    <script>
        // 嘗試順序：1) window.MASTER_DB_DATA (本地 file:// 模式) → 2) jsDelivr CDN
        window._DB_LOADED = false;
        // 指向 master_lookup_db.js 所在的具體 commit SHA（3c8f38fa），確保長期穩定
        const DB_CDN_URL = 'https://cdn.jsdelivr.net/gh/Kevinte67228/keiba-daijin-2026@3c8f38fa7efd6c1ffabed405329a7968774eb992/master_lookup_db.js';

        function showLoading(msg) {
            const el = document.getElementById('loadingMsg');
            if (el) {
                if (msg) {
                    el.style.display = 'block';
                    el.innerHTML = msg;
                } else {
                    el.style.display = 'none';
                }
            }
        }

        async function loadDatabase() {
            if (window.MASTER_DB_DATA) {
                window._DB_LOADED = true;
                if (typeof dbData !== 'undefined') dbData = window.MASTER_DB_DATA;
                if (typeof init === 'function') init();
                return;
            }
            showLoading('⏳ 正在從 CDN 載入資料庫（首次約需 5~15 秒）...');
            try {
                const resp = await fetch(DB_CDN_URL);
                const text = await resp.text();
                // Execute the JS which sets window.MASTER_DB_DATA
                const script = document.createElement('script');
                script.textContent = text;
                document.head.appendChild(script);
                window._DB_LOADED = true;
                if (window.MASTER_DB_DATA && typeof dbData !== 'undefined') {
                    dbData = window.MASTER_DB_DATA;
                }
                showLoading('');
                if (typeof init === 'function') init();
            } catch (e) {
                showLoading('❌ 資料庫載入失敗，請確認網路連線後重新整理。Error: ' + e.message);
            }
        }

        async function clearPwaCache() {
            if (!confirm("確定要清除手機/瀏覽器本機暫存並重新載入最新版本嗎？")) return;
            showLoading("🧹 正在清除快取並重新載入最新版本...");
            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(r => r.unregister()));
                }
                localStorage.clear();
                sessionStorage.clear();
                window.location.reload(true);
            } catch (err) {
                alert("清除快取時發生錯誤: " + err.message);
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', loadDatabase);
    </script>
    <!-- Service Worker 註冊 -->
    <script>

                }).catch(err => console.warn('SW registration failed:', err));

    <script>
        let dbData = window.MASTER_DB_DATA || { all_horses: [], recommendations: [] };
        let currentTab = "all_horses";
        let sortField = "sp";
        let sortAsc = false;

        const ticketWeights = {
            "🌈 虹札": 6, "虹": 6,
            "🥇 金札": 5, "金": 5,
            "🥈 銀札": 4, "銀": 4,
            "🥉 銅札": 3, "銅": 3,
            "🟢 綠札": 2, "綠": 2, "緑": 2,
            "⚪ 無札": 1, "無": 1, "": 0
        };

        function syncHorseData() {
            if (!dbData.all_horses || dbData.all_horses.length === 0) return;
            const horseMap = {};
            dbData.all_horses.forEach(h => {
                if (h.name) horseMap[h.name] = h;
            });
            if (dbData.recommendations) {
                dbData.recommendations.forEach(r => {
                    const matched = horseMap[r.name];
                    if (matched) {
                        // 若推薦馬自身 distance 為空，將詳情頁面的 distance 補齊到外層
                        if (!r.distance || r.distance === "-" || r.distance === "") {
                            r.distance = matched.distance || "-";
                        }
                        if (!r.matched_sp || r.matched_sp === "-" || r.matched_sp === 0) {
                            r.matched_sp = matched.sp || "-";
                        }
                        if (!r.track || r.track === "-") {
                            r.track = matched.track || "-";
                        }
                        if (!r.region || r.region === "-") {
                            r.region = matched.region || "-";
                        }
                    }
                    if (!r.region || r.region === "-") {
                        if (r.category && r.category.includes("日本")) {
                            r.region = "🇯🇵 日本";
                        } else if (r.category && r.category.includes("海外")) {
                            r.region = "海外";
                        }
                    }
                });
            }
        }

        function init() {
            if (window.MASTER_DB_DATA) {
                dbData = window.MASTER_DB_DATA;
            }
            populateYears();
            if (!window.MASTER_DB_DATA || !dbData || !dbData.all_horses || dbData.all_horses.length === 0) {
                console.warn("MASTER_DB_DATA 未載入，嘗試非同步載入 json...");
                fetch("master_lookup_db.json").then(r => r.json()).then(d => {
                    dbData = d;
                    syncHorseData();
                    renderTable();
                }).catch(e => console.error("Data load failed:", e));
            } else {
                syncHorseData();
                renderTable();
            }
        }

        function populateYears() {
            const select = document.getElementById("filterYear");
            for (let yr = 2023; yr >= 1968; yr--) {
                const opt = document.createElement("option");
                opt.value = yr;
                opt.textContent = `${yr} 年登場`;
                select.appendChild(opt);
            }
        }

        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                currentTab = e.target.getAttribute("data-cat");
                renderTable();
            });
        });

        ["filterYear", "filterTicket", "filterSex", "filterSp", "filterDistance", "filterRegion", "filterSearch"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener("input", renderTable);
        });

        // 依據欄位型態計算可比較數值/字串 (修復多型態高精度排序)
        function getSortValue(item, field) {
            if (field === "year") {
                return parseInt(item.year) || 0;
            }
            if (field === "ticket") {
                return ticketWeights[item.ticket] || 0;
            }
            if (field === "sp" || field === "sp_max" || field === "matched_sp") {
                let val = item[field] !== undefined ? item[field] : item.matched_sp;
                return parseInt(val) || 0;
            }
            if (field === "foal_count") {
                let m = (item.foal_count || "").match(/\d+/);
                return m ? parseInt(m[0]) : 0;
            }
            if (field === "stars") {
                let s = item.stars || "";
                return (s.match(/★/g) || []).length;
            }
            if (field === "distance") {
                let m = (item.distance || "").match(/\d+/);
                return m ? parseInt(m[0]) : 0;
            }
            return (item[field] || item.details || "").toString().toLowerCase();
        }

        function renderTable() {
            if (window.MASTER_DB_DATA && (!dbData || !dbData.all_horses || dbData.all_horses.length === 0)) {
                dbData = window.MASTER_DB_DATA;
                syncHorseData();
            }

            const yearVal = document.getElementById("filterYear") ? document.getElementById("filterYear").value : "ALL";
            const ticketVal = document.getElementById("filterTicket") ? document.getElementById("filterTicket").value : "ALL";
            const sexVal = document.getElementById("filterSex") ? document.getElementById("filterSex").value : "ALL";
            const spVal = document.getElementById("filterSp") ? (parseInt(document.getElementById("filterSp").value) || 0) : 0;
            const distVal = document.getElementById("filterDistance") ? document.getElementById("filterDistance").value : "ALL";
            const regionVal = document.getElementById("filterRegion") ? document.getElementById("filterRegion").value : "ALL";
            const searchVal = document.getElementById("filterSearch") ? document.getElementById("filterSearch").value.trim().toLowerCase() : "";

            let dataset = [];
            if (dbData) {
                if (currentTab === "all_horses") {
                    dataset = dbData.all_horses || [];
                } else if (dbData.recommendations) {
                    dataset = dbData.recommendations.filter(r => r.category === currentTab);
                }
            }

            let filtered = dataset.filter(item => {
                if (!item) return false;
                if (yearVal !== "ALL" && item.year != yearVal) return false;
                if (ticketVal !== "ALL") {
                    const t = item.ticket || "";
                    if (!t.includes(ticketVal)) return false;
                }
                if (sexVal !== "ALL") {
                    const s = item.sex || "";
                    if (!s.includes(sexVal)) return false;
                }
                
                const sp = parseInt(item.sp || item.matched_sp) || 0;
                if (spVal > 0 && sp < spVal) return false;

                // 距離適性 (值小的那一個：最短起點距離) 篩選
                if (distVal !== "ALL") {
                    const targetDist = parseInt(distVal);
                    const m = (item.distance || "").match(/(\d+)/);
                    const itemMinDist = m ? parseInt(m[1]) : 0;
                    if (distVal === "2500") {
                        if (itemMinDist < 2500) return false;
                    } else {
                        if (itemMinDist !== targetDist) return false;
                    }
                }

                // 區域別篩選
                if (regionVal !== "ALL") {
                    const r = item.region || "";
                    if (regionVal === "日本") {
                        if (!r.includes("日")) return false;
                    } else if (regionVal === "米") {
                        if (!r.includes("米") && !r.includes("美")) return false;
                    } else if (regionVal === "欧") {
                        if (!r.includes("欧") && !r.includes("歐")) return false;
                    } else if (regionVal === "海外") {
                        if (r.includes("日")) return false;
                    }
                }

                if (searchVal) {
                    const name = (item.name || "").toLowerCase();
                    const sire = (item.sire || "").toLowerCase();
                    const details = (item.details || item.comment || "").toLowerCase();
                    const nameMatch = name.includes(searchVal);
                    const sireMatch = sire.includes(searchVal);
                    const detailMatch = details.includes(searchVal);
                    if (!nameMatch && !sireMatch && !detailMatch) return false;
                }
                return true;
            });

            // 修正：多型態高精度排序 (數字/馬札/星級/距離/文字)
            filtered.sort((a, b) => {
                let valA = getSortValue(a, sortField);
                let valB = getSortValue(b, sortField);

                if (typeof valA === "number" && typeof valB === "number") {
                    return sortAsc ? valA - valB : valB - valA;
                }
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            document.getElementById("matchCount").textContent = filtered.length.toLocaleString();

            renderHeader();
            renderBody(filtered);
        }

        function renderHeader() {
            const tr = document.getElementById("tableHeader");
            tr.innerHTML = "";

            let cols = [];
            if (currentTab === "all_horses") {
                cols = [
                    { key: "year", title: "年度" },
                    { key: "name", title: "馬名" },
                    { key: "region", title: "地域" },
                    { key: "ticket", title: "馬札" },
                    { key: "sex", title: "性別" },
                    { key: "sp", title: "SP 速度" },
                    { key: "sp_max", title: "SP 上限" },
                    { key: "distance", title: "距離適性" },
                    { key: "track", title: "馬場適性" },
                    { key: "growth", title: "成長型" },
                    { key: "sire", title: "父馬" },
                    { key: "action", title: "詳情" }
                ];
            } else if (currentTab === "おすすめ繁殖牝馬" || currentTab === "おすすめ繁殖牝馬セール馬") {
                cols = [
                    { key: "year", title: "年度" },
                    { key: "name", title: "馬名/推薦項目" },
                    { key: "ticket", title: "馬札/等級" },
                    { key: "foal_count", title: "仔出評級" },
                    { key: "track", title: "草地/泥地 (芝・ダ)" },
                    { key: "distance", title: "距離適性" },
                    { key: "factor", title: "成長/因子" },
                    { key: "details", title: "詳細說明" },
                    { key: "action", title: "詳情卡片" }
                ];
            } else {
                cols = [
                    { key: "year", title: "年度" },
                    { key: "name", title: "馬名/推薦項目" },
                    { key: "ticket", title: "馬札/等級" },
                    { key: "sex", title: "性別" },
                    { key: "stars", title: "推薦" },
                    { key: "matched_sp", title: "SP 速度" },
                    { key: "distance", title: "距離適性" },
                    { key: "details", title: "詳細說明" },
                    { key: "action", title: "詳情卡片" }
                ];
            }

            cols.forEach(c => {
                const th = document.createElement("th");
                th.innerHTML = `${c.title} <span class="sort-icon">${sortField === c.key ? (sortAsc ? "▲" : "▼") : ""}</span>`;
                if (c.key !== "action") {
                    th.addEventListener("click", () => {
                        if (sortField === c.key) {
                            sortAsc = !sortAsc;
                        } else {
                            sortField = c.key;
                            sortAsc = false;
                        }
                        renderTable();
                    });
                }
                tr.appendChild(th);
            });
        }

        function renderBody(items) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; color:var(--text-muted); padding:30px;">尚無符合條件的馬匹資料</td></tr>`;
                return;
            }

            items.slice(0, 300).forEach(item => {
                const tr = document.createElement("tr");
                const detailText = item.details || item.comment || "-";

                if (currentTab === "all_horses") {
                    tr.innerHTML = `
                        <td>${item.year || "-"}</td>
                        <td><span class="horse-link" onclick="openModalByName('${escapeQuote(item.name)}')">${item.name}</span></td>
                        <td>${item.region || "-"}</td>
                        <td>${renderTicketBadge(item.ticket)}</td>
                        <td>${item.sex || "-"}</td>
                        <td style="color:var(--gold-color); font-weight:bold;">${item.sp || "-"}</td>
                        <td>${item.sp_max || "-"}</td>
                        <td>${item.distance || "-"}</td>
                        <td>${item.track || "-"}</td>
                        <td>${item.growth || "-"}</td>
                        <td>${item.sire || "-"}</td>
                        <td><button class="btn-detail" onclick="openModalByName('${escapeQuote(item.name)}')">查看</button></td>
                    `;
                } else if (currentTab === "おすすめ繁殖牝馬" || currentTab === "おすすめ繁殖牝馬セール馬") {
                    tr.innerHTML = `
                        <td>${item.year || "-"}</td>
                        <td><span class="horse-link" onclick="openModalByName('${escapeQuote(item.name)}')">${item.name}</span></td>
                        <td>${renderTicketBadge(item.ticket)}</td>
                        <td style="color:var(--gold-color); font-weight:bold;">${item.foal_count || "-"}</td>
                        <td>${item.track || "-"}</td>
                        <td>${item.distance || "-"}</td>
                        <td style="color:#f43f5e; font-weight:600;">${item.factor || item.growth || "-"}</td>
                        <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis;" title="${escapeQuote(detailText)}">${detailText}</td>
                        <td><button class="btn-detail" onclick="openModalByName('${escapeQuote(item.name)}')">查看</button></td>
                    `;
                } else {
                    const sp = item.matched_sp || item.sp || "-";
                    tr.innerHTML = `
                        <td>${item.year || "-"}</td>
                        <td><span class="horse-link" onclick="openModalByName('${escapeQuote(item.name)}')">${item.name}</span></td>
                        <td>${renderTicketBadge(item.ticket)}</td>
                        <td>${item.sex || "-"}</td>
                        <td style="color:var(--gold-color);">${item.stars || "-"}</td>
                        <td style="color:var(--gold-color); font-weight:bold;">${sp}</td>
                        <td>${item.distance || "-"}</td>
                        <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis;" title="${escapeQuote(detailText)}">${detailText}</td>
                        <td><button class="btn-detail" onclick="openModalByName('${escapeQuote(item.name)}')">查看</button></td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        function renderTicketBadge(ticket) {
            if (!ticket) return "-";
            if (ticket.includes("虹")) return `<span class="badge badge-rainbow">🌈 虹札</span>`;
            if (ticket.includes("金")) return `<span class="badge badge-gold">🥇 金札</span>`;
            if (ticket.includes("銀")) return `<span class="badge badge-silver">🥈 銀札</span>`;
            if (ticket.includes("銅")) return `<span class="badge badge-bronze">🥉 銅札</span>`;
            if (ticket.includes("綠") || ticket.includes("緑")) return `<span class="badge badge-green">🟢 綠札</span>`;
            return ticket;
        }

        function escapeQuote(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, "&quot;") : "";
        }

        function openModalByName(horseName) {
            let h = dbData.all_horses.find(x => x.name === horseName);
            let r = dbData.recommendations.find(x => x.name === horseName);

            if (!h) {
                h = { name: horseName, comment: r ? (r.details || r.comment) : "尚無完整史實馬數據" };
            }

            document.getElementById("modalHorseName").textContent = h.name || horseName;
            document.getElementById("modalSubtitle").textContent = `登場年份: ${h.year || (r ? r.year : "-")} 年 | 所屬地域: ${h.region || "-"} | 馬札: ${h.ticket || (r ? r.ticket : "-")}`;

            const grid = document.getElementById("modalStatGrid");
            grid.innerHTML = `
                <div class="stat-item"><div class="stat-label">基本 SP 速度</div><div class="stat-value" style="color:var(--gold-color);">${h.sp || (r ? r.matched_sp : "-")}</div></div>
                <div class="stat-item"><div class="stat-label">成長上限 SP</div><div class="stat-value">${h.sp_max || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">距離適性</div><div class="stat-value">${h.distance || (r ? r.distance : "-")}</div></div>
                <div class="stat-item"><div class="stat-label">馬場適性</div><div class="stat-value">${h.track || (r ? r.track : "-")}</div></div>
                <div class="stat-item"><div class="stat-label">成長型 / 成長力</div><div class="stat-value">${h.growth || (r ? r.growth : "-")} (${h.growth_cap || "-"})</div></div>
                <div class="stat-item"><div class="stat-label">性別</div><div class="stat-value">${h.sex || (r ? r.sex : "-")}</div></div>
                <div class="stat-item"><div class="stat-label">父馬</div><div class="stat-value">${h.sire || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">母馬</div><div class="stat-value">${h.dam || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">瞬發力 / 勝負根性</div><div class="stat-value">${h.shunhatsu || "-"} / ${h.konjo || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">力量 / 精神力</div><div class="stat-value">${h.power || "-"} / ${h.seishin || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">智商 / 柔軟性 / 健康</div><div class="stat-value">${h.keshikosa || "-"} / ${h.junan || "-"} / ${h.kenko || "-"}</div></div>
                <div class="stat-item"><div class="stat-label">詳細攻略建議與評語</div><div class="stat-value" style="font-size:0.85rem; font-weight:normal; line-height:1.4;">${h.comment || (r ? (r.details || r.comment) : "-")}</div></div>
            `;

            document.getElementById("modalBackdrop").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modalBackdrop").style.display = "none";
        }

        // init() 由 loadDatabase() 在資料庫載入完成後自動呼叫
        // 同時隱藏空的 loadingMsg
        document.addEventListener('DOMContentLoaded', () => {
            const el = document.getElementById('loadingMsg');
            if (el && !el.textContent) el.style.display = 'none';
        });
    </script>
</body>
</html>
